<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хорошего дня в Москве</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Матовое стекло: тёмная полупрозрачная подложка + сильное размытие фона */
    --glass: rgba(28, 30, 32, 0.42);
    --glass-strong: rgba(28, 30, 32, 0.55);
    --glass-inner: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.16);
    --blur: blur(22px) saturate(140%);
    --text: #f5f5f3;
    --muted: rgba(245, 245, 243, 0.68);
    --accent: #ff8a3d;
    --error-bg: rgba(255, 90, 70, 0.18);
    --error: #ffb4a6;
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #2b2f2d;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  /* Фон: однотонный тёмный, поверх — фотографии */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background: #2b2f2d; /* однотонный, пока грузятся фото */
  }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.3)); }

  /* Фотофон: два слоя с плавной сменой (1 с) и медленным приближением */
  .slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1s ease-in-out;
    will-change: opacity, transform;
  }
  .slide.show { opacity: 1; }
  .slide.zoom { animation: zoom 62s linear forwards; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .slide.zoom { animation: none; } }

  .caption {
    position: fixed; right: 16px; bottom: 16px; z-index: 1; max-width: min(420px, calc(100% - 32px));
    background: var(--glass-strong); color: #fff;
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    padding: 10px 16px; border-radius: 14px; font-size: 0.85rem; line-height: 1.35;
    transition: opacity 1s ease-in-out;
  }
  .caption b { font-weight: 600; display: block; }
  .caption span { opacity: 0.8; }
  .caption small { display: block; opacity: 0.6; font-size: 0.75rem; margin-top: 2px; }
  .caption:empty { display: none; }
  main { padding-bottom: 90px !important; }
  header.card { padding: 12px 20px; }


  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .updated { color: var(--muted); font-size: 0.9rem; }
  button {
    font: inherit; font-weight: 500; padding: 9px 20px; border-radius: 999px;
    background: rgba(255,255,255,0.12); color: var(--text); cursor: pointer;
    border: 1px solid rgba(255,255,255,0.28);
    transition: background .2s;
  }
  button:hover { background: rgba(255,255,255,0.22); }
  button:disabled { opacity: 0.6; cursor: progress; }

  .card {
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 18px 20px;
  }
  .label { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; letter-spacing: 0.02em; }
  .time-card { text-align: center; padding: 32px 20px; margin-bottom: 16px; }
  .clock { font-size: clamp(3.5rem, 14vw, 7rem); font-weight: 200; letter-spacing: 2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .date { color: var(--muted); margin-top: 10px; font-size: 1.1rem; }

  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  .value { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .up { color: #8fe3a6; } .down { color: #ff9c8a; }

  .news h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .news-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 800px) { .news-cols { grid-template-columns: 1fr; } }
  .news h3 { font-size: 0.8rem; color: var(--accent); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .news ul { list-style: none; padding: 0; margin: 0; }
  .news li { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.92rem; line-height: 1.35; }
  .news li:last-child { border-bottom: 0; }
  .news a { color: var(--text); text-decoration: none; }
  .news a:hover { text-decoration: underline; }
  .news time { display: block; color: var(--muted); font-size: 0.8rem; }

  .error {
    background: var(--error-bg); color: var(--error);
    border-radius: 10px; padding: 8px 12px; font-size: 0.88rem; margin-top: 8px;
  }
  .loading { color: var(--muted); }
  .source { color: var(--muted); font-size: 0.78rem; text-align: center; margin: -6px 0 16px; }
  /* Состояние загрузки: мерцающая заглушка вместо значения */
  .is-loading { position: relative; color: transparent !important; text-shadow: none; pointer-events: none; }
  .is-loading::after {
    content: ""; position: absolute; left: 0; top: 15%; height: 70%; width: min(140px, 80%);
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.08) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
  }
  .sub.is-loading::after { width: min(180px, 90%); }
  .clock.is-loading::after { left: 50%; transform: translateX(-50%); width: min(360px, 70%); }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  /* Компьютер: всё помещается в один экран, без прокрутки */
  @media (min-width: 801px) {
    html, body { height: 100%; overflow: hidden; }
    main {
      height: 100vh; display: flex; flex-direction: column;
      padding: 2vh 16px 0 !important; padding-bottom: 84px !important;
    }
    main > header { margin-bottom: 1.6vh; }
    .time-card { padding: 2.5vh 20px; margin-bottom: 1.6vh; }
    .clock { font-size: clamp(3rem, 13vh, 8rem); }
    .date { margin-top: 0.8vh; }
    .row { margin-bottom: 0.8vh; }
    .source { margin: 0 0 1.2vh; }
    .row .card { padding: 1.6vh 20px; }
    .value { font-size: clamp(1.4rem, 4.2vh, 2.2rem); }
    .news { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .news h2 { margin-bottom: 1vh; }
    .news-cols { flex: 1; min-height: 0; }
    .news-cols > div { min-height: 0; overflow: hidden;
      -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent);
              mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
    .news li a { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="slide" id="slide-a"></div>
  <div class="slide" id="slide-b"></div>
</div>
<div class="caption" id="caption" aria-live="polite"></div>

<main>
  <header class="card">
    <h1 id="greeting">Хорошего дня в Москве</h1>
    <div class="controls">
      <span class="updated" id="updated">Обновление…</span>
      <button id="refresh">Обновить</button>
    </div>
  </header>

  <section class="card time-card">
    <div class="label">Москва</div>
    <div class="clock is-loading" id="clock">00:00:00</div>
    <div class="date" id="date"></div>
    <div id="time-error"></div>
  </section>

  <div class="row">
    <section class="card">
      <div class="label">Курс USD (ЦБ РФ)</div>
      <div class="value" id="usd">—</div>
      <div class="sub" id="usd-sub"></div>
      <div id="usd-error"></div>
    </section>
    <section class="card">
      <div class="label">Курс EUR (ЦБ РФ)</div>
      <div class="value" id="eur">—</div>
      <div class="sub" id="eur-sub"></div>
      <div id="eur-error"></div>
    </section>
    <section class="card">
      <div class="label">Погода (Open-Meteo)</div>
      <div class="value" id="temp">—</div>
      <div class="sub" id="precip"></div>
      <div id="weather-error"></div>
    </section>
  </div>
  <div class="source">Данные получены из внешних API</div>

  <section class="card news">
    <h2>Последние новости</h2>
    <div class="news-cols" id="news"></div>
  </section>
</main>

<script>
const TZ = 'Europe/Moscow';
const TIME_URL = 'https://time.now/developer/api/timezone/Europe/Moscow';
const CBR_URL = 'https://www.cbr-xml-daily.ru/daily_json.js';
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173'
  + '&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=Europe%2FMoscow';
const FEEDS = [
  { title: 'Экономика', url: 'https://www.vedomosti.ru/rss/rubric/economics/global.xml' },
  { title: 'Бизнес', url: 'https://www.vedomosti.ru/rss/rubric/business/industry.xml' },
  { title: 'Технологии', url: 'https://www.vedomosti.ru/rss/rubric/technology/hi_tech.xml' },
];
// RSS Ведомостей не отдаёт CORS-заголовки, поэтому читаем через публичные прокси (по очереди)
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];

const $ = id => document.getElementById(id);
const showError = (id, msg) => { $(id).innerHTML = msg ? `<div class="error">${escapeHtml(msg)}</div>` : ''; };
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => n.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });

function setLoading(ids, on) {
  for (const id of ids) { $(id).classList.toggle('is-loading', on); if (on) $(id).textContent = $(id).textContent || '\u00a0'; }
}

async function fetchWithTimeout(url, ms = 10000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'превышено время ожидания' : (e.message || 'сеть недоступна'));
  } finally { clearTimeout(t); }
}

/* ---------- Время ---------- */
let timeOffset = 0;      // разница между временем API и часами браузера, мс
let clockTimer = null;

function renderClock() {
  const now = new Date(Date.now() + timeOffset);
  $('clock').textContent = now.toLocaleTimeString('ru-RU', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const hour = +now.toLocaleString('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' });
  // 0–4 ночь, 5–11 утро, 12–16 день, 17–23 вечер
  const greet = hour < 5 ? 'Доброй ночи в Москве'
    : `Хорошего ${hour < 12 ? 'утра' : hour < 17 ? 'дня' : 'вечера'} в Москве`;
  if ($('greeting').textContent !== greet) { $('greeting').textContent = greet; document.title = greet; }
  $('date').textContent = now.toLocaleDateString('ru-RU', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

async function loadTime() {
  try {
    const data = await (await fetchWithTimeout(TIME_URL)).json();
    const iso = data.utc_datetime || data.datetime;
    const ms = iso ? Date.parse(iso) : (data.unixtime ? data.unixtime * 1000 : NaN);
    if (isNaN(ms)) throw new Error('неожиданный формат ответа');
    timeOffset = ms - Date.now();
    showError('time-error', '');
  } catch (e) {
    timeOffset = 0;
    showError('time-error', `Не удалось получить время с time.now (${e.message}). Показано время по часам вашего устройства для Москвы.`);
  }
  if (!clockTimer) clockTimer = setInterval(renderClock, 1000);
  renderClock();
  $('clock').classList.remove('is-loading');
}

/* ---------- Курсы ЦБ ---------- */
function renderRate(code, v) {
  const id = code.toLowerCase();
  const value = v.Value / v.Nominal, prev = v.Previous / v.Nominal, diff = value - prev;
  $(id).textContent = fmt(value) + ' ₽';
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  const sign = diff > 0 ? '▲ +' : diff < 0 ? '▼ ' : '';
  $(id + '-sub').innerHTML = `<span class="${cls}">${sign}${fmt(diff)}</span> к предыдущему дню`;
  showError(id + '-error', '');
}

async function loadRates() {
  const ids = ['usd', 'usd-sub', 'eur', 'eur-sub'];
  setLoading(ids, true);
  try {
    const data = await (await fetchWithTimeout(CBR_URL)).json();
    const date = new Date(data.Date).toLocaleDateString('ru-RU');
    for (const code of ['USD', 'EUR']) {
      if (!data.Valute?.[code]) throw new Error('нет данных по ' + code);
      renderRate(code, data.Valute[code]);
      $(code.toLowerCase() + '-sub').innerHTML += `<br>на ${date}`;
    }
  } catch (e) {
    for (const id of ['usd', 'eur']) {
      $(id).textContent = '—'; $(id + '-sub').textContent = '';
      showError(id + '-error', `Курсы ЦБ недоступны: ${e.message}`);
    }
  } finally { setLoading(ids, false); }
}

/* ---------- Погода ---------- */
const WMO = {0:'Ясно',1:'Преимущественно ясно',2:'Переменная облачность',3:'Пасмурно',45:'Туман',48:'Изморозь',
  51:'Слабая морось',53:'Морось',55:'Сильная морось',56:'Ледяная морось',57:'Ледяная морось',
  61:'Небольшой дождь',63:'Дождь',65:'Сильный дождь',66:'Ледяной дождь',67:'Ледяной дождь',
  71:'Небольшой снег',73:'Снег',75:'Сильный снег',77:'Снежная крупа',80:'Ливень',81:'Ливень',82:'Сильный ливень',
  85:'Снегопад',86:'Сильный снегопад',95:'Гроза',96:'Гроза с градом',99:'Гроза с градом'};

async function loadWeather() {
  const ids = ['temp', 'precip'];
  setLoading(ids, true);
  try {
    const c = (await (await fetchWithTimeout(WEATHER_URL)).json()).current;
    if (!c || typeof c.temperature_2m !== 'number') throw new Error('неожиданный формат ответа');
    const t = Math.round(c.temperature_2m);
    $('temp').textContent = (t > 0 ? '+' : '') + t + ' °C';
    $('precip').innerHTML = `${escapeHtml(WMO[c.weather_code] ?? '')}<br>Осадки: ${fmt(c.precipitation, 1)} мм · ощущается как ${Math.round(c.apparent_temperature)} °C`;
    showError('weather-error', '');
  } catch (e) {
    $('temp').textContent = '—'; $('precip').textContent = '';
    showError('weather-error', `Погода (Open-Meteo) недоступна: ${e.message}`);
  } finally { setLoading(ids, false); }
}

/* ---------- Новости ---------- */
async function fetchFeed(url) {
  let lastErr;
  // 1) rss2json — отдаёт ленту в JSON с CORS
  try {
    const j = await (await fetchWithTimeout('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(url), 12000)).json();
    if (j.status !== 'ok' || !j.items?.length) throw new Error(j.message || 'лента пуста');
    return j.items.slice(0, 5).map(it => ({ title: it.title, link: it.link, date: it.pubDate && it.pubDate.replace(' ', 'T') + 'Z' }));
  } catch (e) { lastErr = e; }
  // 2) запасные прокси с сырым XML
  for (const proxy of PROXIES) {
    try {
      const text = await (await fetchWithTimeout(proxy(url), 12000)).text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const items = [...xml.querySelectorAll('item')];
      if (!items.length) throw new Error('лента пуста или повреждена');
      return items.slice(0, 5).map(it => ({
        title: it.querySelector('title')?.textContent.trim() ?? '',
        link: it.querySelector('link')?.textContent.trim() ?? '#',
        date: it.querySelector('pubDate')?.textContent,
      }));
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function loadNews() {
  const box = $('news');
  box.innerHTML = FEEDS.map((f, i) => `<div><h3>${f.title}</h3><div id="feed-${i}" class="loading">Загрузка…</div></div>`).join('');
  await Promise.all(FEEDS.map(async (f, i) => {
    const el = $('feed-' + i);
    try {
      const items = await fetchFeed(f.url);
      el.className = '';
      el.innerHTML = '<ul>' + items.map(n => {
        const d = n.date ? new Date(n.date) : null;
        const when = d && !isNaN(d) ? d.toLocaleString('ru-RU', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
        const safeLink = /^https?:\/\//.test(n.link) ? n.link : '#';
        return `<li><a href="${escapeHtml(safeLink)}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>${when ? `<time>${when}</time>` : ''}</li>`;
      }).join('') + '</ul>';
    } catch (e) {
      el.className = '';
      el.innerHTML = `<div class="error">Не удалось загрузить ленту «${f.title}»: ${escapeHtml(e.message)}</div>`;
    }
  }));
}

/* ---------- Обновление ---------- */
async function refreshAll() {
  const btn = $('refresh');
  btn.disabled = true;
  $('updated').textContent = 'Обновление…';
  await Promise.allSettled([loadTime(), loadRates(), loadWeather(), loadNews()]);
  const now = new Date(Date.now() + timeOffset);
  $('updated').textContent = 'Обновлено: ' + now.toLocaleTimeString('ru-RU', { timeZone: TZ });
  btn.disabled = false;
}

/* ---------- Фотофон: фестиваль «Первозданная Россия» ---------- */
// Имя файла: «Автор. Название.jpg» — до первой точки автор, после — название фото
const PHOTOS = [
  'Алексей Харитонов. Белые Скалы.jpg',
  'Алексей Харитонов. Кекуры в бухте Золотая.jpg',
  'Алексей Харитонов. Рыба Стальной реки.jpg',
  'Алексей Шаскольский. «Надоел ты мне, косолапый».jpg',
  'Андрей Грачев. Горный хребет Дуссе-Алинь.jpg',
  'Валерия Зверева. Стрекоза и муравей.jpg',
  'Виктор Тяхт. Вот я какой.jpg',
  'Виталий Горшков. Овцебык.jpg',
  'Владимир Аникеев. Дикий кот.jpg',
  'Дмитрий Голубев. Тропики средней полосы.jpg',
  'Дмитрий Иванов. Золотые леса.jpg',
  'Евгений Андреев. Кипарисовое озеро.jpg',
  'Егор Власов. Краснозобая казарка.jpg',
  'Михаил Каминский. Бонсай над Царским пляжем с видом на мыс Капчик.jpg',
  'Николай Гернет. Сон Умки.jpg',
  'Олег Пантелеев. Зубр.jpg',
  'Олеся Федосеенкова. В цветах Кавказа.jpg',
  'Ольга Васик. Закат над термокарстовым озером.jpg',
  'Сергей Карпухин. Хребет Черского.jpg',
];
const SLIDE_MS = 60 * 1000;

function parsePhoto(file) {
  const base = file.replace(/\.[^.]+$/, '');
  const dot = base.indexOf('.');
  return {
    src: 'img/' + encodeURIComponent(file),
    author: (dot >= 0 ? base.slice(0, dot) : '').trim(),
    title: (dot >= 0 ? base.slice(dot + 1) : base).trim(),
  };
}

const photos = PHOTOS.map(parsePhoto).sort(() => Math.random() - 0.5);
let photoIdx = -1, front = $('slide-a'), back = $('slide-b');

function preload(src) {
  return new Promise((ok, fail) => { const i = new Image(); i.onload = ok; i.onerror = fail; i.src = src; });
}

async function nextPhoto() {
  for (let tries = 0; tries < photos.length; tries++) {
    photoIdx = (photoIdx + 1) % photos.length;
    const p = photos[photoIdx];
    try { await preload(p.src); } catch { continue; }   // битый файл — пропускаем
    back.style.backgroundImage = `url("${p.src}")`;
    back.classList.remove('zoom'); void back.offsetWidth; // перезапуск анимации
    back.classList.add('zoom', 'show');
    front.classList.remove('show');
    [front, back] = [back, front];
    const cap = $('caption');
    cap.style.opacity = 0;
    setTimeout(() => {
      cap.innerHTML = `<b>${escapeHtml(p.title)}</b>${p.author ? `<span>${escapeHtml(p.author)}</span>` : ''}<small>Фестиваль «Первозданная Россия»</small>`;
      cap.style.opacity = 1;
    }, 500);
    return;
  }
}

nextPhoto();
setInterval(nextPhoto, SLIDE_MS);

$('refresh').addEventListener('click', refreshAll);
refreshAll();
</script>
</body>
</html>
